name: Business case verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python -m consulting.business_case --output /tmp/business-case.json
      - run: diff evidence/business-case.json /tmp/business-case.json
      - name: Isolated lint tools
        run: |
          python -m venv .quality-venv
          .quality-venv/bin/python -m pip install -r requirements-quality.lock
          .quality-venv/bin/python -m ruff check --select E4,E7,E9,F consulting integration tests
